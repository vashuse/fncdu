[package]
name = "fncdu"
version = "0.1.0"
edition = "2024"
authors = ["vashuse"]
description = "Stream an ncdu JSON export filtered to a specific UID."
readme = "README.md"
license = "MIT"
keywords = ["ncdu", "disk-usage", "uid", "filesystem", "cli"]
categories = ["command-line-utilities", "filesystem"]
rust-version = "1.85"

[dependencies]
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.0"
serde_json = "1.0"
tempfile = "3.10"
